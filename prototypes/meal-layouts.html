<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>R&amp;J Meals Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a studio page — chrome on crust, one live app frame (container-query driven) on base, so each study can be seen at desktop and phone width. Single dark look: the app's Catppuccin Mocha palette. */
:root {
  color-scheme: dark;
  --base:#1e1e2e; --mantle:#181825; --crust:#11111b;
  --s0:#313244; --s1:#45475a; --s2:#585b70;
  --o0:#6c7086; --o1:#7f849c; --sub0:#a6adc8; --sub1:#bac2de; --text:#cdd6f4;
  --lav:#b4befe; --blue:#89b4fa; --sky:#89dceb; --green:#a6e3a1; --red:#f38ba8; --pink:#f5c2e7; --peach:#fab387; --mauve:#cba6f7;
  --font:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--crust); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.45; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--lav); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ---------- studio chrome ---------- */
.studio { max-width:1320px; margin:0 auto; padding:20px 16px 32px; display:flex; flex-direction:column; gap:14px; }
.ch-head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; }
.ch-head h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
.ch-head h1 span { color:var(--lav); }
.ch-head p { margin:2px 0 0; color:var(--sub0); font-size:14px; max-width:62ch; }
.ch-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.ch-tabs button { flex:0 0 auto; display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:var(--r); border:1px solid var(--s0); background:var(--mantle); color:var(--sub0); font-weight:500; }
.ch-tabs button b { font-weight:600; color:var(--o1); font-variant-numeric:tabular-nums; }
.ch-tabs button.on { background:var(--s0); border-color:var(--lav); color:var(--text); }
.ch-tabs button.on b { color:var(--lav); }
.notes { display:grid; grid-template-columns: minmax(0,1.4fr) repeat(3, minmax(0,1fr)); gap:10px 20px; padding:14px 16px; border-radius:var(--r-lg); background:var(--mantle); border:1px solid var(--s0); }
.notes h2 { margin:0 0 2px; font-size:16px; font-weight:600; }
.notes p, .notes li { margin:0; color:var(--sub1); font-size:13.5px; }
.notes ul { margin:0; padding-left:16px; display:grid; gap:2px; }
.notes .lbl { display:block; margin-bottom:4px; }
.cost { display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--text); font-size:14px; }
.cost i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--s2); }
.cost i.f { background:var(--peach); }
@media (max-width: 900px) { .notes { grid-template-columns:1fr 1fr; } .notes > :first-child { grid-column:1 / -1; } }
@media (max-width: 520px) { .notes { grid-template-columns:1fr; } }

.stagewrap { display:flex; justify-content:center; }
.frame { position:relative; container-type:inline-size; container-name:app; width:100%; height:min(860px, calc(100dvh - 120px)); min-height:560px; background:var(--base); border:1px solid var(--s0); border-radius:20px; overflow:hidden; transition:width .25s ease; }
.frame.phone { width:390px; max-width:100%; height:min(800px, calc(100dvh - 120px)); border-radius:32px; border:8px solid var(--mantle); box-shadow:0 0 0 1px var(--s0); }
@media (max-width: 720px) { .ch-view { display:none; } .frame, .frame.phone { width:100%; border-radius:18px; border-width:1px; height:calc(100dvh - 90px); } }

/* ---------- shared app primitives ---------- */
.app { position:absolute; inset:0; display:flex; flex-direction:column; }
.scroll { overflow-y:auto; min-height:0; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--s1) transparent; }
.top { flex:0 0 auto; display:flex; align-items:center; gap:14px; height:56px; padding:0 16px; background:var(--mantle); border-bottom:1px solid var(--s0); }
.brand { color:var(--lav); font-size:19px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
.user { margin-left:auto; color:var(--sub0); font-size:14px; font-weight:500; white-space:nowrap; }
.crumb { color:var(--sub0); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.top-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
.top-actions .user { margin-left:0; }
.toptabs { display:none; gap:4px; margin-left:12px; }
.toptabs button { height:36px; padding:0 12px; border-radius:var(--r-sm); border:0; background:transparent; color:var(--sub0); font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.toptabs button:hover { color:var(--text); }
.toptabs button.on { color:var(--lav); background:rgba(180,190,254,.12); }
@container app (min-width: 720px) { .toptabs { display:flex; } }
.wrap { width:100%; max-width:760px; margin:0 auto; padding:18px 14px 28px; display:flex; flex-direction:column; gap:14px; }

.lbl { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--o1); margin:0; }
.lbl.green { color:var(--green); } .lbl.blue { color:var(--blue); }
.pagehead h1 { margin:0; font-size:24px; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
.pagehead p { margin:2px 0 0; color:var(--sub0); font-size:14px; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 16px; border-radius:var(--r); border:1px solid transparent; font-weight:600; font-size:15px; white-space:nowrap; transition:background .15s, opacity .15s, transform .1s; }
.btn:active { transform:scale(.98); }
.btn.sm { height:36px; padding:0 12px; font-size:14px; border-radius:10px; }
.btn.wide { width:100%; }
.btn-primary { background:var(--lav); color:var(--crust); } .btn-primary:hover { opacity:.9; }
.btn-soft { background:var(--s1); color:var(--text); } .btn-soft:hover { background:var(--s2); }
.btn-ghost { background:transparent; color:var(--sub0); } .btn-ghost:hover { background:var(--s0); color:var(--text); }
.btn-danger { background:transparent; border-color:rgba(243,139,168,.45); color:var(--red); } .btn-danger:hover { background:rgba(243,139,168,.1); }
.btn-ghost.danger { color:var(--red); }
.iconbtn { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--r); border:0; background:transparent; color:var(--sub0); flex:0 0 auto; transition:background .15s; }
.iconbtn:hover { background:var(--s1); color:var(--text); }
.iconbtn.fav { color:var(--green); } .iconbtn.fav:hover { background:rgba(166,227,161,.14); }
.badge { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--lav); color:var(--crust); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.seg { display:inline-flex; padding:3px; gap:2px; border-radius:10px; background:var(--mantle); border:1px solid var(--s1); flex:0 0 auto; }
.seg button { height:28px; padding:0 10px; border:0; border-radius:7px; background:transparent; color:var(--sub0); font-size:13px; font-weight:600; }
.seg button.on { background:var(--s1); color:var(--text); }

/* grocery pill */
.gpill { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px 0 10px; border-radius:999px; border:1px solid var(--s1); background:transparent; color:var(--sub0); font-size:13.5px; font-weight:600; white-space:nowrap; }
.gpill.on { background:rgba(180,190,254,.14); border-color:transparent; color:var(--lav); }

/* search + typeahead */
.search { position:relative; flex:1 1 260px; min-width:0; }
.sbox { display:flex; align-items:center; gap:8px; height:44px; padding:0 4px 0 12px; border-radius:var(--r); background:var(--s0); border:1px solid var(--s1); color:var(--o1); }
.sbox:focus-within { border-color:var(--lav); box-shadow:0 0 0 2px rgba(180,190,254,.35); }
.sbox input { flex:1; min-width:0; height:100%; border:0; background:transparent; outline:0; color:var(--text); font-size:15px; }
.sbox input::placeholder { color:var(--o1); }
.sbox .seg { background:var(--base); }
.ta:empty { display:none; }
.ta { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:40; padding:4px; border-radius:var(--r); background:var(--s0); border:1px solid var(--s1); box-shadow:0 16px 40px rgba(0,0,0,.5); }
.ta.up { top:auto; bottom:calc(100% + 10px); }
.ta button { width:100%; display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:0; border-radius:var(--r-sm); background:transparent; text-align:left; font-size:14px; }
.ta button:hover, .ta button.hl { background:var(--s1); }
.ta button span:last-child { color:var(--sub0); font-size:12.5px; flex:0 0 auto; }
.ta .none { padding:10px 12px; color:var(--sub0); font-size:14px; }
@container app (max-width: 420px) { .sbox .seg button { padding:0 7px; } }

/* recipe cards */
.list { display:flex; flex-direction:column; gap:10px; }
.card { background:var(--s0); border:1px solid var(--s1); border-radius:var(--r-lg); padding:14px 14px 12px 16px; }
.card.off { background:transparent; border-style:dashed; }
.card.off .nm { color:var(--sub0); }
.card-head { width:100%; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:0; border:0; background:none; text-align:left; }
.nm { font-weight:600; font-size:17px; line-height:1.3; text-wrap:balance; min-width:0; }
.mt { color:var(--sub0); font-size:13.5px; }
.chev { color:var(--o1); flex:0 0 auto; transition:transform .2s; display:inline-flex; }
.open .chev { transform:rotate(180deg); }
.card-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; flex-wrap:wrap; }
.card-actions { display:flex; align-items:center; gap:2px; margin-left:auto; }
.menu-wrap { position:relative; }
.menu { position:absolute; right:0; top:calc(100% + 4px); z-index:35; min-width:200px; padding:4px; border-radius:var(--r); background:var(--mantle); border:1px solid var(--s1); box-shadow:0 16px 40px rgba(0,0,0,.5); display:flex; flex-direction:column; }
.menu button { display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border:0; border-radius:var(--r-sm); background:transparent; text-align:left; font-size:14px; font-weight:500; }
.menu button:hover { background:var(--s0); }
.menu button.danger { color:var(--red); }

.detail { margin-top:12px; padding-top:14px; border-top:1px solid var(--s1); display:flex; flex-direction:column; gap:16px; }
.ing { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px 18px; }
@container app (min-width: 560px) { .ing { grid-template-columns:1fr 1fr; } }
.ing li { display:flex; gap:8px; }
.ing li::before { content:'•'; color:var(--green); }
.steps { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:10px; counter-reset:s; }
.steps li { display:flex; gap:10px; max-width:68ch; }
.steps li::before { counter-increment:s; content:counter(s) '.'; color:var(--blue); font-weight:600; min-width:22px; text-align:right; font-variant-numeric:tabular-nums; }

.listfoot { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; color:var(--sub0); font-size:14px; }
.empty { padding:36px 16px; text-align:center; color:var(--sub0); border:1px dashed var(--s1); border-radius:var(--r-lg); }
.empty b { display:block; color:var(--text); font-size:16px; margin-bottom:4px; }

/* grocery list */
.gl { display:flex; flex-direction:column; gap:10px; }
.gl-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.gl-head h2 { margin:0; font-size:18px; font-weight:600; }
.gl-head p { margin:2px 0 0; color:var(--sub0); font-size:13px; font-variant-numeric:tabular-nums; }
.gl-items { list-style:none; margin:0; padding:0; }
.gl-items label { display:flex; align-items:flex-start; gap:12px; padding:9px 2px; border-bottom:1px solid var(--s0); cursor:pointer; font-size:15px; }
.gl-items li:last-child label { border-bottom:0; }
.gl-items input { width:18px; height:18px; margin:2px 0 0; accent-color:var(--lav); flex:0 0 auto; }
.gl-items label.done span { color:var(--o0); text-decoration:line-through; }
.gl-from { color:var(--o1); font-size:12px; display:block; }

/* overlays */
.scrim { position:absolute; inset:0; z-index:50; background:rgba(17,17,27,.6); border:0; padding:0; }
.drawer { position:absolute; z-index:51; top:0; right:0; bottom:0; width:min(400px, 100%); background:var(--base); border-left:1px solid var(--s1); display:flex; flex-direction:column; box-shadow:-20px 0 50px rgba(0,0,0,.4); }
.drawer-head { display:flex; justify-content:flex-end; padding:8px 8px 0; }
.drawer .scroll { padding:0 18px 20px; flex:1; }
.toast { position:absolute; z-index:70; left:50%; bottom:88px; transform:translateX(-50%); max-width:calc(100% - 32px); padding:10px 16px; border-radius:var(--r); background:var(--text); color:var(--crust); font-weight:500; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.4); }

/* ---------- 1: Tidied tabs ---------- */
.l1 .scroll { flex:1; }
.addrow { display:flex; gap:8px; flex-wrap:wrap; }
.split { display:flex; flex:0 0 auto; }
.split .btn { border-radius:var(--r) 0 0 var(--r); }
.split select { height:44px; border:0; border-left:1px solid var(--s2); border-radius:0 var(--r) var(--r) 0; background:var(--s1); color:var(--text); padding:0 8px; font-weight:600; }
.bottomnav { flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); height:64px; background:var(--mantle); border-top:1px solid var(--s0); }
.bottomnav button { border:0; background:transparent; color:var(--sub0); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12px; font-weight:500; }
.bn-ic { position:relative; display:flex; align-items:center; justify-content:center; width:52px; height:28px; border-radius:14px; }
.bottomnav button.on { color:var(--lav); }
.bottomnav button.on .bn-ic { background:rgba(180,190,254,.15); }
.bn-ic .badge { position:absolute; top:-6px; right:2px; min-width:18px; height:18px; font-size:11px; padding:0 5px; }
@container app (min-width: 720px) { .bottomnav { display:none; } }
.fav-card { display:flex; align-items:center; gap:10px; }
.fav-card > div { flex:1; min-width:0; }

/* ---------- 2: Planner + list ---------- */
.l2-body { position:relative; flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); }
.l2-body > main { min-height:0; padding-bottom:64px; }
.summary { display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--sub0); font-size:14px; font-variant-numeric:tabular-nums; }
.summary b { color:var(--text); font-weight:600; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.ccard { background:var(--s0); border:1px solid var(--s1); border-radius:var(--r-lg); padding:8px 6px 8px 14px; }
.ccard.off { background:transparent; border-style:dashed; }
.ccard.off .nm { color:var(--sub0); }
.ccard-row { display:flex; align-items:center; gap:4px; }
.ccard-row .card-head { flex:1; align-items:center; min-height:44px; }
.ccard-row .nm { font-size:16px; }
.ccard .detail { margin:6px 8px 8px 0; }
.ccard .stack { display:flex; flex-direction:column; min-width:0; }
.l2-side { position:absolute; z-index:30; left:0; right:0; bottom:0; height:56px; background:var(--mantle); border-top:1px solid var(--s1); border-radius:18px 18px 0 0; display:flex; flex-direction:column; transition:height .25s ease; box-shadow:0 -12px 30px rgba(0,0,0,.35); }
.sheet-open .l2-side { height:78%; }
.sheet-handle { flex:0 0 56px; display:flex; align-items:center; gap:10px; padding:0 18px; border:0; background:transparent; color:var(--text); font-weight:600; font-size:15px; }
.sheet-handle .chev { margin-left:auto; transform:rotate(180deg); }
.sheet-open .sheet-handle .chev { transform:none; }
.l2-side .side-inner { flex:1; padding:0 18px 18px; }
.l2-side .gl-head h2 { display:none; }
@container app (min-width: 760px) {
  .l2-body { grid-template-columns:minmax(0,1fr) 340px; }
  .l2-body > main { padding-bottom:0; }
  .l2-side, .sheet-open .l2-side { position:static; height:auto; border-radius:0; border-top:0; border-left:1px solid var(--s0); box-shadow:none; min-height:0; }
  .sheet-handle { display:none; }
  .l2-side .side-inner { padding:20px 20px 24px; }
  .l2-side .gl-head h2 { display:block; }
}

/* ---------- 3: Recipe reader ---------- */
.l3-body { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); }
.l3-list { display:flex; flex-direction:column; min-height:0; background:var(--mantle); border-right:1px solid var(--s0); }
.l3-tools { padding:12px; display:flex; flex-direction:column; gap:8px; }
.l3-list .scroll { flex:1; padding:0 8px; }
.l3-list ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.l3-item { width:100%; display:flex; flex-direction:column; gap:2px; padding:10px 12px; border:0; border-radius:var(--r); background:transparent; text-align:left; }
.l3-item:hover { background:var(--s0); }
.l3-item.on { background:var(--s0); box-shadow:inset 0 0 0 1px var(--s1); }
.l3-item .nm { font-size:15px; font-weight:500; }
.l3-item.on .nm { color:var(--lav); }
.l3-item .mt { display:flex; align-items:center; gap:8px; font-size:12.5px; }
.l3-item .mt svg { flex:0 0 auto; }
.l3-item.off .nm { color:var(--o1); }
.tag-off { color:var(--o1); }
.l3-foot { padding:10px 16px; border-top:1px solid var(--s0); color:var(--sub0); font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.link { border:0; background:none; padding:0; color:var(--sub0); text-decoration:underline; text-underline-offset:3px; font-size:13px; }
.link:hover { color:var(--red); }
.l3-detail { display:none; }
.show-detail .l3-list { display:none; }
.show-detail .l3-detail { display:block; }
.reader { max-width:880px; margin:0 auto; padding:16px 18px 32px; display:flex; flex-direction:column; gap:18px; }
.reader h1 { margin:0; font-size:28px; line-height:1.15; font-weight:600; letter-spacing:-.015em; text-wrap:balance; }
.reader .mt { font-size:15px; margin-top:4px; }
.reader-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.reader-cols { display:grid; gap:22px; }
.reader-cols .steps li { font-size:16px; }
.ing-box { background:var(--s0); border-radius:var(--r-lg); padding:14px 16px; }
.reader-cols .ing { grid-template-columns:1fr; }
.backbtn { align-self:flex-start; margin-left:-8px; }
@container app (min-width: 720px) {
  .l3-body { grid-template-columns:300px minmax(0,1fr); }
  .l3-list, .show-detail .l3-list { display:flex; }
  .l3-detail, .show-detail .l3-detail { display:block; }
  .backbtn { display:none; }
  .reader { padding:28px 32px 40px; }
  .reader h1 { font-size:34px; }
}
@container app (min-width: 1000px) { .reader-cols { grid-template-columns:280px minmax(0,1fr); align-items:start; } }

/* ---------- 4: Command bar ---------- */
.l4 .scroll { flex:1; }
.l4 .wrap { padding-bottom:110px; gap:4px; }
.l4-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 4px 10px; }
.l4-head h1 { margin:0; font-size:20px; font-weight:600; }
.rows { display:flex; flex-direction:column; border-top:1px solid var(--s0); }
.row { border-bottom:1px solid var(--s0); }
.row-line { display:flex; align-items:center; gap:4px; min-height:56px; padding:0 2px; }
.row-main { flex:1; min-width:0; display:flex; align-items:baseline; gap:12px; padding:8px 4px; border:0; background:none; text-align:left; }
.row-main .nm { font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-wrap:nowrap; }
.row-main .mt { margin-left:auto; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.row.off .nm { color:var(--o1); }
.chk { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:1.5px solid var(--s2); background:transparent; color:var(--o1); flex:0 0 auto; }
.chk.on { border-color:transparent; background:rgba(180,190,254,.16); color:var(--lav); }
.row .detail { border-top:0; margin:0 0 16px 44px; padding-top:0; }
.row.open { background:linear-gradient(var(--mantle), var(--mantle)); }
.cmdbar { position:absolute; z-index:45; left:0; right:0; bottom:0; padding:12px 12px 14px; display:flex; justify-content:center; background:linear-gradient(to top, var(--base) 55%, rgba(30,30,46,0)); pointer-events:none; }

const UNITS = { lb:'lb', lbs:'lb', oz:'oz', cup:'cup', cups:'cup', tbsp:'tbsp', tsp:'tsp', can:'can', cans:'can', clove:'clove', cloves:'clove' };
function parse(s) {
  const m = s.match(/^([\d.\/]+)\s+(.*)$/);
  if (!m) return { q:null, u:'', n:s };
  const q = m[1].includes('/') ? m[1].split('/').map(Number).reduce((a, b) => a / b) : Number(m[1]);
  const rest = m[2].split(' ');
  const u = UNITS[rest[0]] || '';
  if (u) rest.shift();
  return { q, u, n: rest.join(' ') };
}
function fmtQ(q) {
  const w = Math.floor(q), f = q - w;
  const fr = [[.25,'¼'],[.5,'½'],[.75,'¾'],[1/3,'⅓'],[2/3,'⅔']];
  const hit = fr.find(([k]) => Math.abs(f - k) < .02);
  if (f > .02 && !hit) return String(+q.toFixed(2));
  return (w ? String(w) : '') + (hit ? hit[1] : '') || '0';
}
function fmtIng({ q, u, n }, scale = 1) {
  if (q == null) return n;
  q *= scale;
  let unit = u;
  if (unit && q > 1 && ['cup','can','clove'].includes(unit)) unit += 's';
  return `${fmtQ(q)} ${unit ? unit + ' ' : ''}${n}`;
}
function groceries() {
  const map = new Map();
  for (const r of week().filter(r => r.groc)) {
    for (const s of r.ingredients) {
      const p = parse(s);
      const key = `${p.u}|${p.n}`;
      const cur = map.get(key);
      if (cur && cur.q != null && p.q != null) { cur.q += p.q; cur.from.push(r.name); }
      else if (!cur) map.set(key, { ...p, key, from:[r.name] });
    }
  }
  return [...map.values()].map(i => ({ ...i, text: fmtIng(i, S.scale) }));
}
const minutes = t => parseInt(t, 10) || 0;
function totalTime() {
  const m = week().reduce((a, r) => a + minutes(r.time), 0);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim() : `${m} min`;
}

// ---------- render ----------
const frame = document.getElementById('frame');
const LAYOUTS = { 1: L1, 2: L2, 3: L3, 4: L4, 5: L5 };
function render() {
  const pos = {};
  frame.querySelectorAll('[data-scroll]').forEach(el => pos[el.dataset.scroll] = el.scrollTop);
  frame.innerHTML = LAYOUTS[S.layout]() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  frame.querySelectorAll('[data-scroll]').forEach(el => { if (pos[el.dataset.scroll]) el.scrollTop = pos[el.dataset.scroll]; });
  frame.classList.toggle('phone', S.view === 'phone');
  renderChrome();
}
let toastTimer;
function toast(msg) {
  S.toast = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2400);
}
function addRecipe(id) {
  if (S.week.includes(id)) return;
  S.week.push(id); R[id].groc = true; R[id].day = null;
  toast(`Added ${R[id].name}`);
}
function randomIds(n) {
  const free = POOL.filter(p => !S.week.includes(p.id)).map(p => p.id).sort(() => Math.random() - .5);
  return free.slice(0, n);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const lay = e.target.closest('[data-layout]');
  if (lay) { Object.assign(S, { layout: +lay.dataset.layout, menuId: null, openId: null, drawer: false, modalId: null, l4groc: false, confirmClear: false }); render(); return; }
  const v = e.target.closest('[data-view]');
  if (v) { S.view = v.dataset.view; render(); return; }
  if (!frame.contains(e.target)) return;

  const pickBtn = e.target.closest('[data-pick]');
  if (pickBtn) { addRecipe(pickBtn.dataset.pick); render(); return; }
  if (!e.target.closest('.search')) frame.querySelectorAll('.ta').forEach(t => t.innerHTML = '');

  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menuId) { S.menuId = null; render(); } return; }
  const id = a.dataset.id, val = a.dataset.v, r = R[id];
  const act = a.dataset.act;
  if (act !== 'menu') S.menuId = null;
  if (act !== 'clear' && act !== 'cancelClear') S.confirmClear = false;
  switch (act) {
    case 'open': S.openId = S.openId === id ? null : id; break;
    case 'menu': S.menuId = S.menuId === id ? null : id; break;
    case 'groc': r.groc = !r.groc; break;
    case 'fav': r.fav = !r.fav; break;
    case 'remove': S.week = S.week.filter(x => x !== id); if (S.modalId === id) S.modalId = null; if (S.selId === id) { S.selId = S.week[0]; S.l3Detail = false; } toast(`Removed ${r.name}`); break;
    case 'swap': {
      const [nid] = randomIds(1); if (!nid) break;
      S.week[S.week.indexOf(id)] = nid; R[nid].day = r.day; R[nid].groc = true;
      if (S.openId === id) S.openId = nid; if (S.selId === id) S.selId = nid; if (S.modalId === id) S.modalId = nid;
      toast(`Swapped in ${R[nid].name}`); break;
    }
    case 'random': {
      const n = S.layout === 1 ? S.randCount : 1;
      const ids = randomIds(n);
      if (!ids.length) { toast('Every sample recipe is already this week'); break; }
      ids.forEach(x => { S.week.push(x); R[x].groc = true; R[x].day = null; });
      toast(ids.length === 1 ? `Added ${R[ids[0]].name}` : `Added ${ids.length} random recipes`); break;
    }
    case 'clear': if (S.confirmClear) { S.week = []; S.confirmClear = false; S.openId = null; toast('Cleared this week'); } else S.confirmClear = true; break;
    case 'cancelClear': S.confirmClear = false; break;
    case 'filter': S.filter = val; break;
    case 'tab': S.tab = val; break;
    case 'scale': S.scale = +val; break;
    case 'sheet': S.sheetOpen = !S.sheetOpen; break;
    case 'drawer': S.drawer = !S.drawer; break;
    case 'l4groc': S.l4groc = !S.l4groc; break;
    case 'sel': S.selId = id; S.l3Detail = true; break;
    case 'back': S.l3Detail = false; break;
    case 'day': S.day = val; break;
    case 'modal': S.modalId = id; break;
    case 'closeModal': S.modalId = null; break;
    case 'move': r.day = val || null; if (val) S.day = val; break;
    case 'toggleWeek': if (S.week.includes(id)) { S.week = S.week.filter(x => x !== id); } else addRecipe(id); break;
    case 'cook': toast('Cook mode opens here, the same as today'); break;
    case 'toast': toast(val); break;
  }
  render();
});
frame.addEventListener('change', e => {
  if (e.target.dataset.check != null) {
    const k = e.target.dataset.check;
    S.checked.has(k) ? S.checked.delete(k) : S.checked.add(k);
    render();
  } else if (e.target.id === 'randcount') S.randCount = +e.target.value;
});
function matches(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return POOL.filter(p => !S.week.includes(p.id)).filter(p => S.filter === 'name'
    ? p.name.toLowerCase().includes(q)
    : p.ingredients.some(i => i.toLowerCase().includes(q))).slice(0, 6);
}
frame.addEventListener('input', e => {
  if (!e.target.classList.contains('q')) return;
  const ta = e.target.closest('.search').querySelector('.ta');
  const q = e.target.value, ms = matches(q);
  ta.innerHTML = !q.trim() ? '' : ms.length
    ? ms.map((m, i) => `<button type="button" data-pick="${m.id}" class="${i === 0 ? 'hl' : ''}"><span>${esc(m.name)}</span><span>${m.time}</span></button>`).join('')
    : `<div class="none">No recipes match “${esc(q)}”. Try ${S.filter === 'name' ? 'chicken, curry or pasta' : 'garlic, rice or spinach'}.</div>`;
});
frame.addEventListener('keydown', e => {
  if (e.target.classList?.contains('q') && e.key === 'Enter') {
    const [m] = matches(e.target.value);
    if (m) { addRecipe(m.id); render(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modalId || S.drawer || S.l4groc || S.menuId || S.sheetOpen) { Object.assign(S, { modalId: null, drawer: false, l4groc: false, menuId: null, sheetOpen: false }); render(); }
  } else if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) {
    const q = frame.querySelector('.q');
    if (q) { e.preventDefault(); q.focus(); }
  }
});
// drag and drop for the week board
frame.addEventListener('dragstart', e => {
  const t = e.target.closest?.('[data-drag]');
  if (t) { e.dataTransfer.setData('text/plain', t.dataset.drag); e.dataTransfer.effectAllowed = 'move'; }
});
frame.addEventListener('dragover', e => {
  const d = e.target.closest?.('[data-drop]');
  if (!d) return;
  e.preventDefault();
  frame.querySelectorAll('.drop').forEach(x => x !== d && x.classList.remove('drop'));
  d.classList.add('drop');
});
frame.addEventListener('dragleave', e => {
  const d = e.target.closest?.('[data-drop]');
  if (d && !d.contains(e.relatedTarget)) d.classList.remove('drop');
});
frame.addEventListener('drop', e => {
  const d = e.target.closest?.('[data-drop]');
  if (!d) return;
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  if (R[id]) { R[id].day = d.dataset.drop || null; render(); }
});

render();
</script>

</body>
</html>
